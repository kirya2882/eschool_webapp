<style>
.week-strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:16px 0 22px}.week-day{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:65px;padding:9px 0 12px;border-radius:16px;background:var(--surface);color:var(--muted)}.week-day span{font-size:10px}.week-day strong{font-size:18px;font-weight:600;color:var(--text)}.week-day[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}.week-day[aria-pressed=true] strong{color:var(--on-accent)}.week-day.is-today:after{content:'';position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:currentColor}.schedule-heading{margin:0 2px 14px}.schedule-heading h2{font-size:17px}.lesson-card{padding:18px;margin-bottom:12px}.lesson-header{display:flex;align-items:center;gap:12px}.lesson-number{width:36px;height:40px;flex:none;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:20px;border-radius:12px;font-variant-numeric:tabular-nums}.lesson-subject{font-size:16px;font-weight:600;line-height:1.35;text-align:left;overflow-wrap:anywhere}.lesson-room{overflow-wrap:anywhere;font-size:11px;color:var(--muted);margin-top:4px}.lesson-marks{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;max-width:102px;justify-content:flex-end;flex-shrink:0}.lesson-marks .mark{min-height:44px;min-width:42px;font-size:20px}.lesson-homework{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}.lesson-homework .hint{font-size:10px}.lesson-task{margin-top:11px}.lesson-task:first-child{margin-top:0}.task-preview{display:block;text-align:left;width:100%;font-size:13px;line-height:1.65;overflow-wrap:anywhere;white-space:pre-wrap;margin:5px 0}.task-preview span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.lesson-task.done .task-preview{opacity:.55;text-decoration:line-through}.lesson-task-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}.lesson-task-footer .text-btn{font-size:11px;padding:6px 0;min-height:36px}.schedule-empty{padding:32px 18px}.schedule-empty h3{font-size:16px;color:var(--text);margin:8px 0}.schedule-empty p{margin:8px 0 18px}.nav button span{flex-shrink:0}
</style>
<script>
function scheduleKnown(date){return state.scheduleRanges.some(r=>date>=r.start&&date<=r.end);}
function shiftDate(date,days){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);}
function scheduleWeek(date){const day=new Date(date+'T12:00:00Z'),monday=shiftDate(date,-((day.getUTCDay()+6)%7));return Array.from({length:7},(_,i)=>shiftDate(monday,i));}
function lessonCountText(n){return n+' '+(n%100>=11&&n%100<=14?'уроков':n%10===1?'урок':n%10>=2&&n%10<=4?'урока':'уроков');}
function renderSchedule(){
 const lessons=state.lessons.filter(l=>l.date===scheduleDate).sort((a,b)=>a.number-b.number||a.id.localeCompare(b.id)),known=scheduleKnown(scheduleDate),today=Core.today();
 const dayLabel=(scheduleDate===today?'Сегодня · ':scheduleDate===shiftDate(today,1)?'Завтра · ':'')+dateLabel(scheduleDate);
 return heading('Расписание','Время школы · '+(state.lessons.find(l=>l.date===scheduleDate&&l.timeZone)?.timeZone==='Europe/Moscow'?'Москва':state.lessons.find(l=>l.date===scheduleDate&&l.timeZone)?.timeZone||'eSchool'),`<button class="icon-btn" data-es="sync" aria-label="Обновить расписание" ${esAuto.running?'disabled':''}>${icon('refresh')}</button>`)+`<div class="datebar row"><button class="icon-btn" data-action="schedule-prev" aria-label="Предыдущий день">${icon('back')}</button><input id="scheduleDateFilter" type="date" min="2000-01-01" max="2100-12-31" value="${scheduleDate}" aria-label="Дата расписания"><button class="icon-btn" data-action="schedule-next" aria-label="Следующий день">${icon('next')}</button></div><div class="week-strip" aria-label="Дни недели">${scheduleWeek(scheduleDate).map((date,i)=>`<button class="week-day ${date===today?'is-today':''}" data-action="schedule-day" data-date="${date}" aria-pressed="${date===scheduleDate}" aria-label="${dateLabel(date)}"><span>${['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'][i]}</span><strong>${Number(date.slice(-2))}</strong></button>`).join('')}</div><div class="row between schedule-heading"><div><h2>${dayLabel}</h2><p class="hint">${known?lessonCountText(lessons.length):'Расписание из eSchool'}</p></div>${scheduleDate!==today?'<button class="text-btn" data-action="schedule-today">Сегодня</button>':''}</div><p id="scheduleSyncStatus" class="hint" role="status" style="margin-bottom:12px" ${esAuto.running||esAuto.warning?'':'hidden'}>${esc(esAuto.message)}</p>${lessons.length?lessons.map(lessonCard).join(''):`<section class="card empty schedule-empty">${icon('schedule')}<h3 ${known?'':'data-schedule-empty-title'}>${known?'На этот день уроков нет':esAuto.running?'Загружаем расписание…':'Расписание ещё не загружено'}</h3><p>${known?'Можно посмотреть другой день.':'Подключи eSchool в настройках или обнови выбранную неделю.'}</p>${known?'':`<button class="button wide" data-es="sync" ${esAuto.running?'disabled':''}>Загрузить расписание</button><button class="text-btn" data-action="eschool">Подключение eSchool</button>`}</section>`}`;
}
function lessonCard(lesson){
 const content=Core.lessonDetails(lesson,state),sub=state.subjects.find(s=>s.id===lesson.subjectId);
 return `<article class="card lesson-card"><div class="lesson-header"><span class="lesson-number" aria-label="Урок ${lesson.number}">${lesson.number}</span><div class="grow">${sub?`<button class="lesson-subject" data-action="subject-detail" data-id="${esc(sub.id)}">${esc(lesson.subject)}</button>`:`<h3 class="lesson-subject">${esc(lesson.subject)}</h3>`}${lesson.startTime?`<p class="lesson-time">${esc(lesson.startTime)}–${esc(lesson.endTime)}</p>`:''}${lesson.room?`<p class="lesson-room">Кабинет ${esc(lesson.room)}</p>`:''}</div>${content.grades.length?`<div class="lesson-marks" aria-label="Оценки за урок">${content.grades.map(g=>markButton(g,'schedule-grade')).join('')}</div>`:''}</div><div class="lesson-homework">${content.tasks.length?content.tasks.map(t=>`<div class="lesson-task"><span class="hint">Домашнее задание${t.attachments?' · Вложений: '+t.attachments:''}</span><button class="task-preview" data-action="edit-task" data-id="${esc(t.id)}" aria-label="Открыть задание: ${esc(t.subject)}"><span>${esc(t.text)}</span></button>${taskFilesHTML(t)}<div class="lesson-task-footer"><button class="text-btn" data-action="edit-task" data-id="${esc(t.id)}">Подробнее</button></div></div>`).join(''):`<p class="hint">${lesson.taskIds.length?'Задание пока не загружено':'Домашнего задания нет'}</p>`}</div></article>`;
}
function chooseScheduleDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date)))return;scheduleDate=date;render();esScheduleRequest(date);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='schedule-prev')chooseScheduleDate(shiftDate(scheduleDate,-1));if(a==='schedule-next')chooseScheduleDate(shiftDate(scheduleDate,1));if(a==='schedule-today')chooseScheduleDate(Core.today());if(a==='schedule-day')chooseScheduleDate(b.dataset.date);if(a==='schedule-grade'){const grade=state.grades.find(g=>g.id===b.dataset.id);if(grade){selectedId=grade.subjectId;openMark('real',grade);}}});
document.addEventListener('change',e=>{if(e.target.id==='scheduleDateFilter'&&e.target.value)chooseScheduleDate(e.target.value);});
</script>
