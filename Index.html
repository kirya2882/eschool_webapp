window.GradebookBoot=(function(){
 var ready=false,failed=false,timer;
 function fail(error){

let state=normalize(read(key+':state',{subjects:[],grades:[],revision:0})),selectedId=read(key+':selected',null),screen='schedule',detail=false,scheduleDate=Core.today(),taskDate=Core.today(),allTasks=true;

function renderCalculator(){const base=grades(),list=resultGrades();return heading('Калькулятор','Проверь, как новые оценки изменят результат',`<button class="icon-btn" data-action="back-to-marks" aria-label="Вернуться к оценкам">${icon('back')}</button>`)+subjectSelect()+periodControls()+scoreHTML(list,base)+`<section class="card"><div class="section-head row between"><h2>Оценки</h2><span class="badge">${list.length}</span></div>${list.length?`<div class="mark-grid">${list.map(g=>markButton(g)).join('')}</div>`:`<div class="empty">${icon('calculator')}<p>Добавь оценки в калькулятор</p></div>`}</section><section class="card input-card"><h2 style="margin-bottom:16px">Новая оценка</h2>${picks(quickGrade)}${signs(quickModifier)}<div class="row between"><label class="label" for="quickWeight">Коэффициент</label><input id="quickWeight" class="weight-input" inputmode="decimal" value="${esc(weight(quickWeight))}" aria-label="Свой коэффициент"></div>${weightButtons(quickWeight)}<div class="preview-line row between"><span>После добавления</span><strong id="quickForecast">—</strong></div><button class="button wide" data-action="quick-add" data-write>${icon('plus')}Добавить в сценарий</button></section><section class="card input-card"><div class="section-head row between"><h2>Сценарий</h2><button class="text-btn" data-action="reset-scenario" data-write ${!operations().length?'disabled':''}>Сбросить всё</button></div>${operations().length?operations().map(op=>{const orig=state.grades.find(g=>g.id===op.gradeId);const name=op.kind==='add'?'Новая оценка':op.kind==='edit'?'Изменена':'Исключена из расчёта';return `<div class="operation row"><div class="grow"><strong>${name}: ${op.kind==='exclude'?esc(gradeText(orig||{value:'—'})):esc(gradeText(op))}</strong><p>${op.kind==='exclude'?'Можно вернуть в расчёт':'Коэффициент '+weight(op.weight)}</p></div><button class="icon-btn" data-action="undo-operation" data-id="${op.id}" data-write aria-label="Отменить изменение">${icon('undo')}</button></div>`;}).join(''):'<p class="hint">Изменений пока нет. Сценарий хранится отдельно от настоящих оценок.</p>'}</section><details class="formula"><summary>Как считается средний балл?</summary><p>Σ(оценка × коэффициент) ÷ Σ(коэффициентов).</p><p>Например: (5 × 2 + 4 × 1) ÷ (2 + 1) = 4,67. Исключённые оценки не участвуют в расчёте.</p><p>Знаки + и − учитываются, если включены в настройках. Для школьного результата ориентируйся на правила учителя.</p></details>`;}
function renderMarks(){if(detail&&subject()){const gs=grades().slice().sort((a,b)=>b.date.localeCompare(a.date));return heading(subject().name,'Настоящие оценки по предмету',`<button class="icon-btn" data-action="subjects" aria-label="Все предметы">${icon('back')}</button>`)+periodControls()+scoreHTML(gs)+`<div class="row" style="margin-bottom:15px"><button class="button grow" data-action="add-real-grade" data-write>${icon('plus')}Добавить оценку</button><button class="icon-btn" data-action="edit-subject" data-write aria-label="Изменить предмет">${icon('edit')}</button></div><section class="card"><div class="section-head row between"><h2>История</h2><button class="text-btn" data-action="calculate-subject">В калькулятор</button></div>${gs.length?gs.map(g=>`<div class="grade-row row">${markButton(g,'real-mark')}<div class="grow"><h3>${esc(g.note||'Без заметки')}</h3><p>${dateLabel(g.date)} ${g.date.slice(0,4)} · × ${weight(g.weight)}</p></div><button class="icon-btn" data-action="real-mark" data-id="${g.id}" data-write aria-label="Изменить оценку ${g.value}">${icon('edit')}</button></div>`).join(''):'<div class="empty">За выбранный период пока нет оценок.</div>'}</section>`;}
const s=settings(),[start,end]=bounds();return heading('Оценки','Твои предметы и средний балл',`<div class="row"><button class="icon-btn" data-action="free-calculator" aria-label="Свободный калькулятор">${icon('calculator')}</button><button class="icon-btn" data-action="add-subject" data-write aria-label="Добавить предмет">${icon('plus')}</button></div>`)+periodControls()+`<section class="card">${state.subjects.length?state.subjects.map((sub,i)=>{const gs=state.grades.filter(g=>g.subjectId===sub.id&&g.date>=start&&g.date<=end);return `<button class="subject-card row" data-action="subject-detail" data-id="${sub.id}"><span class="subject-letter">${['∑','А','Aa','◇','△','✳'][i%6]}</span><div class="grow"><h3>${esc(sub.name)}</h3><small>Оценок: ${gs.length}</small><div class="mini-marks">${gs.slice(-8).map(g=>`<span>${esc(gradeText(g))}<sup>×${weight(g.weight)}</sup></span>`).join('')}</div></div><span class="avg">${number(Core.average(gs,s))}</span></button>`;}).join(''):'<div class="empty">Добавь первый предмет, чтобы вести свои оценки.</div>'}</section><button class="button wide" style="margin-top:16px" data-action="add-subject" data-write>${icon('plus')}Добавить предмет</button>`;}
function renderTasks(){let tasks=state.tasks.filter(t=>allTasks||t.date===taskDate).sort((a,b)=>a.date.localeCompare(b.date));return heading('Задания',allTasks?'Все домашние задания':'Задания на выбранную дату')+`<div class="datebar row"><button class="icon-btn" data-action="task-prev" aria-label="Предыдущий день">${icon('back')}</button><input id="taskDateFilter" type="date" value="${taskDate}" aria-label="Дата заданий"><button class="icon-btn" data-action="task-next" aria-label="Следующий день">${icon('next')}</button></div><div class="row wrap" style="margin-bottom:18px"><button class="button secondary" data-action="task-today">Сегодня</button><button class="button secondary" data-action="task-tomorrow">Завтра</button><button class="text-btn" data-action="task-all">${allTasks?'За день':'Все задания'}</button></div>${tasks.length?tasks.map(t=>`<article class="card task-card"><div class="row between"><h3 class="grow">${esc(t.subject)}</h3><button class="icon-btn" data-action="edit-task" data-id="${t.id}" data-write aria-label="${t.source==='eschool'?'Открыть задание':'Изменить задание'}">${icon('edit')}</button></div><p>${esc(t.text.slice(0,450))}${t.text.length>450?"…":""}</p>${taskFilesHTML(t)}<div class="row between"><span class="task-date">${dateLabel(t.date)} ${t.date.slice(0,4)} · ${t.source==='eschool'?'eSchool':'вручную'}</span></div></article>`).join(''):'<div class="card empty">'+icon('tasks')+'<p>Нет заданий</p></div>'}<button class="fab" data-action="add-task" data-write aria-label="Добавить задание">${icon('plus')}</button>`;}
function renderSettings(){const s=settings(),r=deviceRegion();return heading('Настройки','Оформление, расчёты и учебный год')+`<div class="setting-section">Оформление</div><section class="card"><div class="setting"><label class="setting-title" for="themeSelect">Тема</label><select id="themeSelect">${[['system','Стандартная'],['light','Светлая'],['dark','Тёмная']].map(([v,n])=>`<option value="${v}" ${s.theme===v?'selected':''}>${n}</option>`).join('')}</select></div></section><div class="setting-section">Калькулятор</div><section class="card"><label class="setting switch-row"><div class="grow"><span class="setting-title">Оценки + и −</span><p>Учитывать знаки при расчёте среднего балла</p></div><input type="checkbox" id="plusMinus" ${s.plusMinus?'checked':''}></label><div class="setting"><label for="signValue" class="setting-title">Значение знака</label><select id="signValue"><option value="0.5" ${s.signValue===0.5?'selected':''}>+0,5 / −0,5</option><option value="0.25" ${s.signValue===0.25?'selected':''}>+0,25 / −0,25</option></select><p>Например, 4+ = ${s.signValue===0.5?'4,5':'4,25'}. Значение ограничено диапазоном 1–5.</p></div><div class="setting"><label class="setting-title" for="periodType">Учебный период</label><select id="periodType">${[['quarters','Четверти'],['halves','Полугодия'],['semesters','Семестры'],['year','Учебный год']].map(([v,n])=>`<option value="${v}" ${s.periodType===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="setting"><button class="text-btn" data-action="calendar" data-write>Границы учебных периодов</button><p>Стандартные даты можно заменить календарём твоей школы.</p></div></section><div class="setting-section">Регион устройства</div><section class="card"><div class="setting"><span class="setting-title">${esc(r.country)}</span><p>${esc(r.source)}</p></div><div class="setting"><span class="setting-title">${esc(r.zone)}</span><p>${new Date().toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</p></div><p class="hint" style="margin:12px 0">Регион настроек может отличаться от фактического местоположения.</p></section><div class="setting-section">Аккаунт и данные</div><section class="card"><div class="setting"><button class="text-btn" data-action="eschool">eSchool</button><p>Оценки, коэффициенты и домашние задания из дневника ученика.</p></div>${esAutoPanel()}<div class="setting">${state.sheetUrl&&/^https:\/\/docs\.google\.com\/spreadsheets\/d\/[\w-]+\/edit$/.test(state.sheetUrl)?`<a href="${esc(state.sheetUrl)}" target="_blank" rel="noopener">Открыть Google Таблицу ${icon('external')}</a>`:'<span class="hint">В демо данные сохраняются только в этом браузере.</span>'}</div><div class="setting"><button class="text-btn" data-action="about">О приложении</button></div></section>`;}
function render(){if(selectedId&&!subject())selectedId=null;theme();nav();$('page').innerHTML=screen==='schedule'?renderSchedule():screen==='calculator'?renderCalculator():screen==='marks'?renderMarks():screen==='tasks'?renderTasks():renderSettings();$('aboutButton').innerHTML=icon('more');controls();forecast();}
function controls(){const disabled=busy||!loaded||!connected||!!pending;document.querySelectorAll('[data-write]').forEach(b=>b.disabled=disabled||b.dataset.action==='reset-scenario'&&!operations().length);document.querySelectorAll('#academicYear,#period,#themeSelect,#plusMinus,#signValue,#periodType,#esAutoSync').forEach(x=>x.disabled=disabled);$('confirmButton').disabled=disabled;}
function setScreen(value){screen=value;render();window.scrollTo({top:0,behavior:'instant'});}
function forecast(){if(!$('quickForecast'))return;const w=Core.parseWeight($('quickWeight').value),valid=Core.validWeight(w);$('quickWeight').setAttribute('aria-invalid',String(!valid));$('quickForecast').textContent=valid?number(Core.average([...resultGrades(),{value:quickGrade,modifier:quickModifier,weight:w}],settings())):'Неверный вес';const button=document.querySelector('[data-action="quick-add"]');if(button)button.disabled=!valid||busy||!connected||!!pending;}
function accept(next){const draft=$('quickWeight')?.value;state=normalize(next);write(key+':state',state);render();if(draft!==undefined&&$('quickWeight')){$('quickWeight').value=draft;forecast();}}
function rpc(method,arg){if(DEMO)return demoRpc(method,arg);return new Promise((resolve,reject)=>{if(!window.google?.script?.run)return reject(new Error('Открой опубликованную ссылку Apps Script.'));let settled=false;const t=setTimeout(()=>{settled=true;reject(new Error('Сервер не ответил вовремя.'));},45000);const r=google.script.run.withSuccessHandler(result=>{if(!settled){clearTimeout(t);resolve(result);}}).withFailureHandler(error=>{if(!settled){clearTimeout(t);reject(new Error(error.message||'Нет связи с Google.'));}});if(method==='getState')r.getState();else r.mutate(arg);});}
async function load(options={}){if(busy)return;const firstLoad=!loaded;busy=true;setStatus('Синхронизация…');controls();try{const next=await rpc('getState');if(!loaded||next.revision!==state.revision)accept(next);connected=true;loaded=true;$('notice').hidden=true;setStatus(DEMO?'Демо · в браузере':'Всё сохранено');}catch(e){connected=false;loaded=true;notify(e.message);setStatus('Нет связи',true);}finally{busy=false;controls();forecast();}if(connected&&pending)await sendPending();if(firstLoad&&connected)setTimeout(()=>esAutoRefresh(),0);}
async function save(event,options={}){if(busy||pending||!connected)return;pending={id:uid(),revision:state.revision,event,quiet:options.quiet===true};write(key+':pending',pending,'sessionStorage');return sendPending();}
async function sendPending(){if(!pending||busy)return;busy=true;controls();setStatus('Сохраняем…');const event=pending.event,quiet=pending.quiet===true;try{const r=await rpc('mutate',pending);pending=null;remove(key+':pending','sessionStorage');accept(r.state);connected=true;if(!r.ok){notify(r.message);if(!quiet&&$('editor').open){$('editorError').textContent=r.message;$('editorError').hidden=false;}if(!quiet)$('confirmDialog').close();setStatus('Проверь изменения',true);return false;}$('notice').hidden=true;if(!quiet){$('editor').close();$('confirmDialog').close();}if(event.type==='subject.add'){selectedId=event.id;write(key+':selected',selectedId);detail=true;screen='marks';}if(event.type==='subject.delete'){selectedId=null;detail=false;}render();setStatus(DEMO?'Демо · в браузере':'Всё сохранено');if(!quiet)toast('Сохранено');return true;}catch(e){if(!quiet){$('editor').close();$('confirmDialog').close();}notify(e.message+' Нажми «Повторить»: запись проверится без дублирования.');setStatus('Запись не подтверждена',true);return false;}finally{busy=false;controls();forecast();}}
const saveSettings=patch=>save({type:'settings.save',id:'app_settings',settings:patch});
const saveScenario=ops=>save({type:'scenario.save',id:scenarioKey(),operations:ops});
function openEditor(context,title,body,buttons){editContext=context;$('editorTitle').textContent=title;$('editorBody').innerHTML=body;$('editorActions').innerHTML=buttons||'<button type="button" class="button secondary" data-action="close-editor">Отмена</button><button type="submit" class="button" data-write>Сохранить</button>';$('editorError').hidden=true;$('editor').showModal();controls();}
function field(label,id,value='',type='text',extra=''){return `<div class="field"><label class="label" for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`;}
function openMark(mode,g=null){editorGrade=g?.value||5;editorModifier=g?.modifier||'';let body=`<div id="editorPicks">${picks(editorGrade,'editor')}</div><div id="editorSigns">${signs(editorModifier,'editor')}</div>${field('Коэффициент','editWeight',g?.weight||1,'text','inputmode="decimal" required')}${weightButtons(g?.weight||1,'editor')}`;if(mode==='real')body+=field('Дата','editDate',g?.date||Core.today(),'date','required')+field('Заметка','editNote',g?.note||'','text','maxlength="160"');else body+='<p class="hint">Изменение только для сценария. Исходные оценки сохраняются.</p>';if(g)body+=`<div class="row wrap" style="margin-top:14px">${mode==='real'?'<button type="button" class="text-btn" data-action="delete-real">Удалить оценку</button>':g.state==='added'?'<button type="button" class="text-btn" data-action="remove-scenario-added">Удалить из сценария</button>':`<button type="button" class="text-btn" data-action="exclude-scenario">${g.excluded?'Вернуть в расчёт':'Исключить из расчёта'}</button><button type="button" class="text-btn" data-action="restore-scenario">Вернуть исходную оценку</button>`}</div>`;openEditor({kind:'mark',mode,grade:g},g?'Изменить оценку':'Новая оценка',body);}
function confirm(title,text,action){confirmAction=action;$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmDialog').showModal();controls();}
function openSubject(edit=false){openEditor({kind:'subject',id:edit?selectedId:null},edit?'Изменить предмет':'Новый предмет',field('Предмет','subjectName',edit?subject().name:'','text','required maxlength="60"')+(edit?'<button type="button" class="text-btn" data-action="delete-subject" style="color:var(--danger);margin-top:10px">Удалить предмет и оценки</button>':''));$('subjectName').focus();}
function openTask(t=null){openEditor({kind:'task',task:t},t?'Задание':'Добавить задание',field('Предмет','taskSubject',t?.subject||subject()?.name||'','text','required maxlength="60" list="subjectOptions"')+`<datalist id="subjectOptions">${state.subjects.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>`+field('Дата','taskDue',t?.date||taskDate,'date','required')+`<div class="field"><label class="label" for="taskText">Задание</label><textarea id="taskText" required maxlength="4000" placeholder="Что нужно сделать?">${esc(t?.text||'')}</textarea></div>`+(t?'<button type="button" class="text-btn" data-action="delete-task" style="color:var(--danger)">Удалить задание</button>':''));}
function openCalendar(){const s=settings(),names=Core.periodNames(s.periodType);const ranges=s.calendar?.[s.academicYear+'_'+s.periodType]||names.map((_,i)=>Core.periodBounds(s.academicYear,s.periodType,i+1));openEditor({kind:'calendar'},'Учебный календарь',`<p class="hint">${s.academicYear} / ${s.academicYear+1}. Укажи даты из календаря своей школы. Стандартные границы приблизительные.</p>`+names.map((n,i)=>`<h3 style="margin:15px 0 8px">${n}</h3><div class="calendar-grid"><label>Начало<input type="date" id="calStart${i}" value="${ranges[i][0]}" required></label><label>Конец<input type="date" id="calEnd${i}" value="${ranges[i][1]}" required></label></div>`).join(''));}
function moveTaskDate(days,from=taskDate){const d=new Date(from+'T12:00:00');d.setDate(d.getDate()+days);taskDate=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');allTasks=false;render();}
function editScenarioMark(g){openMark('scenario',g);}
function removeForGrade(ops,g){return ops.filter(op=>op.gradeId!==g.id&&op.id!==g.id);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
if(a==='screen'){if(b.dataset.screen==='marks')detail=false;if(b.dataset.screen==='tasks')allTasks=true;setScreen(b.dataset.screen);return;}
if(a==='back-to-marks'){detail=!!subject();setScreen('marks');return;}
if(a==='free-calculator'){selectedId=null;detail=false;setScreen('calculator');return;}
if(a==='retry'){pending?sendPending():load();return;}
if(a==='close-editor'){$('editor').close();return;}if(a==='cancel-confirm'){$('confirmDialog').close();return;}if(a==='confirm'){confirmAction?.();return;}
if(a==='add-subject'){openSubject();return;}if(a==='edit-subject'){openSubject(true);return;}
if(a==='subject-detail'){selectedId=id;detail=true;write(key+':selected',selectedId);setScreen('marks');return;}
if(a==='subjects'){detail=false;render();return;}if(a==='calculate-subject'){setScreen('calculator');return;}
if(a==='quick-grade'){quickGrade=Number(b.dataset.value);document.querySelectorAll('[data-action="quick-grade"]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.value)===quickGrade)));forecast();return;}
if(a==='quick-sign'){quickModifier=b.dataset.value;document.querySelectorAll('[data-action="quick-sign"]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.value===quickModifier)));forecast();return;}
if(a==='quick-weight'){quickWeight=Number(b.dataset.value);$('quickWeight').value=weight(quickWeight);document.querySelectorAll('[data-action="quick-weight"]').forEach(x=>x.setAttribute('aria-pressed',String(Number(x.dataset.value)===quickWeight)));forecast();return;}
if(a==='quick-add'){const w=Core.parseWeight($('quickWeight').value);if(Core.validWeight(w)){quickWeight=w;saveScenario([...operations(),{id:uid(),kind:'add',value:quickGrade,weight:w,modifier:quickModifier}]);}return;}
if(a==='editor-grade'){editorGrade=Number(b.dataset.value);$('editorPicks').innerHTML=picks(editorGrade,'editor');return;}
if(a==='editor-sign'){editorModifier=b.dataset.value;$('editorSigns').innerHTML=signs(editorModifier,'editor');return;}
if(a==='editor-weight'){$('editWeight').value=weight(Number(b.dataset.value));document.querySelectorAll('[data-action="editor-weight"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return;}
if(a==='scenario-mark'){editScenarioMark(resultGrades().find(g=>g.id===id));return;}
if(a==='real-mark'){openMark('real',state.grades.find(g=>g.id===id));return;}if(a==='add-real-grade'){openMark('real');return;}
if(a==='undo-operation'){saveScenario(operations().filter(op=>op.id!==id));return;}
if(a==='reset-scenario'){confirm('Сбросить всё?','Все изменения текущего сценария будут удалены. Настоящие оценки останутся.',()=>saveScenario([]));return;}
if(a==='remove-scenario-added'||a==='restore-scenario'){saveScenario(removeForGrade(operations(),editContext.grade));return;}
if(a==='exclude-scenario'){const g=editContext.grade,ops=removeForGrade(operations(),g);if(!g.excluded)ops.push({id:uid(),kind:'exclude',gradeId:g.id});saveScenario(ops);return;}
if(a==='delete-real'){const g=editContext.grade;$('editor').close();confirm('Удалить оценку?',`Оценка ${gradeText(g)} будет удалена из дневника.`,()=>save({type:'grade.delete',id:g.id}));return;}
if(a==='delete-subject'){const sid=selectedId;$('editor').close();confirm('Удалить предмет?',`«${subject().name}» и его оценки будут удалены.`,()=>save({type:'subject.delete',id:sid}));return;}
if(a==='add-task'){openTask();return;}if(a==='edit-task'){const t=state.tasks.find(t=>t.id===id);t.source==='eschool'?openRemoteTask(t):openTask(t);return;}
if(a==='delete-task'){const t=editContext.task;$('editor').close();confirm('Удалить задание?',t.subject+': '+t.text.slice(0,100),()=>save({type:'task.delete',id:t.id}));return;}
if(a==='task-prev'){moveTaskDate(-1);return;}if(a==='task-next'){moveTaskDate(1);return;}if(a==='task-today'){moveTaskDate(0,Core.today());return;}if(a==='task-tomorrow'){moveTaskDate(1,Core.today());return;}if(a==='task-all'){allTasks=!allTasks;render();return;}
if(a==='calendar'){openCalendar();return;}
